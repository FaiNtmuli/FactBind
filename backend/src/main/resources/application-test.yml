# Profile used by the automated tests (JUnit 5 + MockMvc).
spring:
  datasource:
    url: jdbc:h2:mem:middemo-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

middemo:
  seed:
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn
